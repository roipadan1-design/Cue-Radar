name: CUE RADAR Automated Scanner & Database Syncer

on:
  # Run every 3 days at 06:00 UTC
  schedule:
    - cron: '0 6 */3 * *'
  # Allow manual trigger anytime from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Opportunities Crawler & Verification
        run: node scripts/crawl-opportunities.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit & Push Updated Database
        run: |
          git config --global user.name "cue-radar-bot"
          git config --global user.email "bot@cueradar.org"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No changes in opportunities database."
          else
            git commit -m "chore(data): auto-update opportunities database [skip ci]"
            git push origin main
          fi
